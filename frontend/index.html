<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <title>Absensi</title>
    <script>
      // Apply the saved/system theme before React paints to avoid a
      // light-mode flash. Matches src/lib/useTheme.js getInitialTheme().
      // The browser chrome color follows the same theme.
      (function () {
        try {
          var stored = localStorage.getItem('takota-theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" style="position:fixed;inset:0;z-index:2147483646;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#ffffff;">
      <img src="/takota-chibi.png" alt="" style="width:64px;height:64px;border-radius:6px;object-fit:cover;" />
      <p style="font-size:11px;font-weight:500;color:#737373;font-family:system-ui,sans-serif;">Loading...</p>
    </div>
    <script>
      // Match the splash background to the theme before React paints.
      (function () {
        try {
          var stored = localStorage.getItem('takota-theme')
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var splash = document.getElementById('boot-splash')
          if (dark && splash) {
            splash.style.background = '#0a0a0a'
            splash.firstElementChild.nextElementSibling.style.color = '#a3a3a3'
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
