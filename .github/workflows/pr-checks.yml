name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build -o /dev/null ./cmd/api

      - name: Vet
        working-directory: backend
        run: go vet ./...

  api-test:
    name: API Integration Test
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-build
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: takota
          POSTGRES_PASSWORD: takota
          POSTGRES_DB: takota_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takota"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
#        options: >-
#          --health-cmd "wget -q -O- http://localhost:9000/minio/health/live || exit 1"
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5
        command: server /data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for MinIO to be ready
        run: |
          echo "Waiting for MinIO to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is healthy"
              break
            fi
            echo "Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live || (echo "MinIO failed to become healthy" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: takota-app:api-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start application container
        run: |
          docker run -d --name takota-app \
            --network host \
            -e PORT=8080 \
            -e APP_ENV=test \
            -e GIN_MODE=debug \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_USER=takota \
            -e DB_PASSWORD=takota \
            -e DB_NAME=takota_db \
            -e DB_SSL_MODE=disable \
            -e S3_ENDPOINT=http://127.0.0.1:9000 \
            -e S3_ACCESS_KEY=minioadmin \
            -e S3_SECRET_KEY=minioadmin \
            -e S3_BUCKET_NAME=takota-bucket \
            -e S3_USE_SSL=false \
            -e S3_USE_PATH_STYLE_ENDPOINT=true \
            -e S3_REGION=us-east-1 \
            -e JWT_SECRET=ci-test-secret-key \
            -e TIMEZONE_APP=Asia/Jakarta \
            takota-app:api-test

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          curl -sf http://localhost/health || (echo "API failed to start" && docker logs takota-app && exit 1)

      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' || exit 1

      - name: Test user login
        run: |
          echo "=== Testing user001 login ==="
          USER_RESPONSE=$(curl -sf -X POST http://localhost/api/auth \
            -H "Content-Type: application/json" \
            -d '{"username":"user001","password":"testing123"}')
          echo "User login response: $USER_RESPONSE"
          USER_TOKEN=$(echo "$USER_RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "USER_TOKEN=$USER_TOKEN" >> $GITHUB_ENV

          echo "=== Testing admin login ==="
          ADMIN_RESPONSE=$(curl -sf -X POST http://localhost/api/auth \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"testing123"}')
          echo "Admin login response: $ADMIN_RESPONSE"
          ADMIN_TOKEN=$(echo "$ADMIN_RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> $GITHUB_ENV

          # Validate tokens exist
          [ -n "$USER_TOKEN" ] || (echo "USER_TOKEN is empty" && exit 1)
          [ -n "$ADMIN_TOKEN" ] || (echo "ADMIN_TOKEN is empty" && exit 1)

      - name: Test user home
        run: |
          echo "=== Testing GET /api/user/home ==="
          HOME_RESPONSE=$(curl -sf http://localhost/api/user/home \
            -H "Authorization: Bearer $USER_TOKEN")
          echo "Home response: $HOME_RESPONSE"
          echo "$HOME_RESPONSE" | grep -q '"greeting_widget"' || exit 1

      - name: Test absence submission
        run: |
          # Runs BEFORE the attendance test below: the API correctly
          # rejects an absence request once a normal attendance already
          # exists for the same user/day ("Cannot submit absence after
          # normal attendance"), so these two mutually-exclusive actions
          # can't both be tested against the same user on the same day
          # unless absence goes first.
          echo "=== Testing POST /api/user/absence ==="
          ABSENCE_RESPONSE=$(curl -sf -X POST http://localhost/api/user/absence \
            -H "Authorization: Bearer $USER_TOKEN" \
            -F "option=sick" \
            -F "reason=Feeling unwell - CI test")
          echo "Absence response: $ABSENCE_RESPONSE"
          echo "$ABSENCE_RESPONSE" | grep -q '"message"' || exit 1

          echo "=== Testing GET /api/admin/absences ==="
          ABSENCES_RESPONSE=$(curl -sf http://localhost/api/admin/absences \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          echo "Absences response: $ABSENCES_RESPONSE"
          echo "$ABSENCES_RESPONSE" | grep -q '"data"' || exit 1

      - name: Test admin endpoints
        run: |
          echo "=== Testing GET /api/admin/users ==="
          USERS_RESPONSE=$(curl -sf http://localhost/api/admin/users \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          echo "Users response: $USERS_RESPONSE"
          echo "$USERS_RESPONSE" | grep -q '"data"' || exit 1

          echo "=== Testing GET /api/admin/attendances ==="
          ATTS_RESPONSE=$(curl -sf http://localhost/api/admin/attendances \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          echo "Attendances response: $ATTS_RESPONSE"
          echo "$ATTS_RESPONSE" | grep -q '"data"' || exit 1

      - name: Test user attendance
        run: |
          echo "=== Testing POST /api/user/attendance ==="
          ATTENDANCE_RESPONSE=$(curl -sf -X POST http://localhost/api/user/attendance \
            -H "Authorization: Bearer $USER_TOKEN" \
            -F "latitude=-6.2088" \
            -F "longitude=106.8456")
          echo "Attendance response: $ATTENDANCE_RESPONSE"
          echo "$ATTENDANCE_RESPONSE" | grep -q '"message"' || exit 1

      - name: Test unauthorized access
        run: |
          echo "=== Testing unauthorized access (no token) ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/user/home)
          echo "HTTP code: $HTTP_CODE"
          [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || exit 1

          echo "=== Testing forbidden access (user trying admin route) ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/admin/users \
            -H "Authorization: Bearer $USER_TOKEN")
          echo "HTTP code: $HTTP_CODE"
          [ "$HTTP_CODE" = "403" ] || exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs takota-app --tail 100

      - name: Cleanup
        if: always()
        run: docker rm -f takota-app 2>/dev/null || true

  docker-image-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: takota-app:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
