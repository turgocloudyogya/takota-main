name: Build, Test & Publish to GHCR

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lowercase image name: ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image reference
        run: |
          echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ---------- Build (multi-stage: frontend + backend) ----------
      - name: Build image (load into local docker for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Test: spin up Postgres + MinIO, run the image ----------
      - name: Start Postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=takota \
            -e POSTGRES_PASSWORD=takota \
            -e POSTGRES_DB=takota_db \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U takota -d takota_db && break
            sleep 2
          done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 \
            minio/minio:latest server /data

      - name: Run application image
        run: |
          docker run -d --name takota-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:80 \
            -e PORT=8080 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_USER=takota \
            -e DB_PASSWORD=takota \
            -e DB_NAME=takota_db \
            -e DB_SSL_MODE=disable \
            -e S3_ENDPOINT=http://host.docker.internal:9000 \
            -e S3_ACCESS_KEY=minioadmin \
            -e S3_SECRET_KEY=minioadmin \
            -e S3_BUCKET_NAME=takota-bucket \
            -e S3_USE_SSL=false \
            -e S3_USE_PATH_STYLE_ENDPOINT=true \
            -e S3_REGION=us-east-1 \
            -e JWT_SECRET=test-secret-change-me \
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Backend healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          docker logs takota-app
          exit 1

      - name: Test frontend is served
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          echo "Frontend OK"

      - name: Test /api proxy to backend
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/api/auth \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"wrong-password"}')
          echo "$RESPONSE" | grep -q '"error"'
          echo "API proxy OK"

      # ---------- Push to GHCR ----------
      - name: Push image to GitHub Container Registry
        run: |
          docker tag "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Clean up test containers
        if: always()
        run: docker rm -f takota-app postgres minio || true
