# Docker Compose for Development
# Only services (PostgreSQL, Redis, MinIO)
# Backend & Frontend run natively via `make dev`

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: takota-postgres
    environment:
      POSTGRES_USER: takota
      POSTGRES_PASSWORD: takota_password
      POSTGRES_DB: takota_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takota -d takota_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - takota-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: takota-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - takota-network

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: takota-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - takota-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  takota-network:
    driver: bridge
