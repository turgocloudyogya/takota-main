services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takota
      POSTGRES_PASSWORD: takota
      POSTGRES_DB: takota_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takota -d takota_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/turgocloudyogya/takota-main:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: production
      GIN_MODE: release
      JWT_SECRET: change-this-in-production
      JWT_EXPIRY_HOURS: 24
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: takota
      DB_PASSWORD: takota
      DB_NAME: takota_db
      DB_SSL_MODE: disable
      DB_SSL_ENABLE: "false"
      DB_MAX_CONNECTIONS: 25
      DB_MAX_IDLE_CONNECTIONS: 10
      DB_QUERY_EXEC_MODE: cache_describe
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: takota-bucket
      S3_USE_SSL: "false"
      S3_USE_PATH_STYLE_ENDPOINT: "true"
      S3_REGION: us-east-1
      S3_PUBLIC_HOST: http://minio:9000
      S3_USE_CLOUDFRONT: "false"
      MAX_LOGIN_ATTEMPTS: 10
      LOGIN_LOCK_DURATION_MINUTES: 5
      TIMEZONE_APP: Asia/Jakarta
      MAX_ATTENDANCE_FILE_SIZE_MB: 10
      MAX_ABSENCE_FILE_SIZE_MB: 50
      VAPID_PUBLIC_KEY: change-me-vapid-public-key
      VAPID_PRIVATE_KEY: change-me-vapid-private-key
      VAPID_SUBJECT: mailto:admin@example.com

volumes:
  pg_data:
  minio_data:
  redis_data:
