# =============================================================================
# Docker Compose - Production with Nginx Reverse Proxy
# =============================================================================
# Production deployment dengan Nginx sebagai reverse proxy.
# Nginx config sebagai EXTERNAL FILE (di nginx/nginx.conf).
#
# SETUP:
#   1. Copy files ke server:
#      - docker-compose.yml (file ini)
#      - .env
#      - nginx/nginx.conf
#   2. Edit .env dengan production values
#   3. Login: docker login ghcr.io
#   4. Start: docker compose up -d
#
# FILES NEEDED ON SERVER:
#   - docker-compose.yml
#   - .env
#   - nginx/nginx.conf
#   Total: 3 items
#
# ARCHITECTURE:
#   Internet → Nginx:80/443 (reverse proxy) → API:8080 → PostgreSQL, Redis
#
# NGINX ROLE: Reverse Proxy (security, rate limiting, SSL termination)
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: takota-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - takota-network

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: takota-redis-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - takota-network

  # ==========================================================================
  # Takota API Application
  # ==========================================================================
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: takota-api-prod
    env_file:
      - .env
    environment:
      PORT: 8080
      APP_ENV: production
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_HOST: ${S3_PUBLIC_HOST}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - takota-network

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: takota-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - takota-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  nginx_logs:

# =============================================================================
# Networks
# =============================================================================
networks:
  takota-network:
    driver: bridge
